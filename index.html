<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鼓手練習 App</title>
<meta name="description" content="四個獨立的爵士鼓練習 App：Linear Grooves（手）、Double Pedal（腳）、Djent Grooves（Djent 節奏庫）與 Time Keeper（時間感）">
<meta name="theme-color" content="#15191E">
<link rel="icon" href="linear-grooves/icons/icon-192.png" type="image/png">
<style>
  :root { --bg: #E9EDF0; --surface: #FFFFFF; --ink: #15191E; --muted: #5A6470; --line: #CDD4DA; --accent: #A9611B; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0F1215; --surface: #181D22; --ink: #E6EAEE; --muted: #96A1AC; --line: #2B333B; --accent: #D8913F; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0F1215; --surface: #181D22; --ink: #E6EAEE; --muted: #96A1AC; --line: #2B333B; --accent: #D8913F; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  a.app { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); }
  a.app:hover { border-color: var(--accent); }
  a.app img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  a.app b { display: block; font-size: 17px; }
  a.app span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>鼓手練習 App</h1>
  <p>四個獨立的 App，請打開後分別「加到主畫面」安裝。</p>
  <a class="app" href="linear-grooves/sticking.html">
    <img src="linear-grooves/icons/icon-192.png" alt="">
    <div><b>Linear Grooves</b><span>練手：手順、Paradiddle、複節奏、線性節奏</span></div>
  </a>
  <a class="app" href="double-pedal/">
    <img src="double-pedal/icons/icon-192.png" alt="">
    <div><b>Double Pedal 雙踏腳法</b><span>練腳：雙踏、手腳組合、腳踩鈸、Swing</span></div>
  </a>
  <a class="app" href="djent/">
    <img src="djent/icons/icon-192.png" alt="">
    <div><b>Djent Grooves</b><span>Djent 節奏庫：奇數分組跨小節、Gospel chops 線性 Fill</span></div>
  </a>
  <a class="app" href="timekeeper/">
    <img src="timekeeper/icons/icon-192.png" alt="">
    <div><b>Time Keeper</b><span>時間感：Gap click、位移節拍器、漸進速度，麥克風聽你打得準不準</span></div>
  </a>
</main>
</body>
</html>
